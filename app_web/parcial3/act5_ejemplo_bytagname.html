<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 7 - getElementsByTagName</title>
    <link rel="stylesheet" href="css/general.css">
</head>
<body>
    <header>
        <h1> Actividad 7 - getElementsByTagName</h1>
    </header>

    <p>Este es el primer parafo.</p>
    <p>Este es el segundo parrafo.</p>
    <p>Este es el tercer parrafo.</p>

    <button onclick="resaltarParrafos()">Resaltar Parrafos</button>
    <script>
        function resaltarParrafos() {
            const parrafos = document.getElementsByTagName("p"); 
            colores = ["#f3badb", "#bac0f3", "#baf3e0"];  
                   
            for (let i = 0; i < parrafos.length; i++) {
                parrafos[i].style.backgroundColor = colores[i];
                parrafos[i].style.padding = "5px";
            }
        }
    </script>

    <footer>
        <p>Renata Rodríguez Martínez | 189363</p>
    </footer>
</body>
</html>
