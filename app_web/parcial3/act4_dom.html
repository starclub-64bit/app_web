<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Actividad 4 - DOM Enlace</title>
        <script>
            function clic() {
            var enlace = document.getElementById("enlace");
            alert(enlace.href); 
            }
        </script>
    </head>
    <body>
        <header>
            <h1>Actividad 4 - DOM</h1>
        </header>

        <a id="enlace" href="https://www.google.com">Enlace</a>
        <p>Clic en el enlace</p>
        <button onclick="clic()">Enlace</button>
        
        <footer>
            <p>Renata Rodríguez Martínez | 189363</p>
        </footer>
    </body>
</html>
