<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Actividad 2</title>
  </head>
<body>
  <header>
    <h1>Actividad 2 - Ejemplos</h1>
  </header>

<h1>Ejemplos</h1>

<p>Clic en el boton</p>

<button onclick="myFunction()">Boton</button>

<p id="demo"></p>

<script>
function myFunction() {
  var mensaje = "Hola Mundo";
  var numeroLetras = mensaje.length; // numeroLetras = 10
 
  document.getElementById("demo").innerHTML =
    "Cant de caracteres " + numeroLetras ;
 

  var mensaje1 = "Hola";
  var mensaje2 = " Mundo";
  mensaje = mensaje1 + mensaje2; // mensaje = "Hola Mundo"
  alert( mensaje );

  var mensaje1 = "Hola";
  var mensaje2 = mensaje1.concat(" Mundo"); // mensaje2 = "Hola Mundo“
  alert( mensaje2 );

  var variable1 = "Hola ";
  var variable2 = 3;
  mensaje = variable1 + variable2; // mensaje = "Hola 3"
  alert( mensaje );

  var mensaje1 = "Hola";
  var mensaje2 = mensaje1.toUpperCase(); // mensaje2 = "HOLA“
  alert( mensaje2 );

  var mensaje1 = "HolA";
  var mensaje2 = mensaje1.toLowerCase(); // mensaje2 = "hola"
  alert( mensaje2 );  

  var mensaje = "Hola";
  var letra = mensaje.charAt(0); // letra = H
  letra = mensaje.charAt(2); // letra = l
  alert( letra );

  var mensaje = "Hola";
  var posicion = mensaje.indexOf('a'); // posicion = 3
  alert( posicion );
  posicion = mensaje.indexOf('b'); // posicion = -1
  alert( posicion );

  var mensaje = "Hola";
  var posicion = mensaje.lastIndexOf('a'); // posicion = 3
  alert( posicion );
  posicion = mensaje.lastIndexOf('b'); // posicion = -1
  alert( posicion );

  var mensaje = "Hola Mundo";
  var porcion = mensaje.substring(2); // porcion = "la Mundo"
  alert( porcion );
  porcion = mensaje.substring(5); // porcion = "Mundo"
  alert( porcion );
  porcion = mensaje.substring(7); // porcion = "ndo“
  alert( porcion );

  //Si se indica un inicio negativo, se devuelve la misma cadena original:
  var mensaje = "Hola Mundo";
  var porcion = mensaje.substring(-2); // porcion = "Hola Mundo"
  alert( porcion );

  var mensaje = "Hola Mundo";
  var porcion = mensaje.substring(1, 8); // porcion = "ola Mun"
  alert( porcion );
  porcion = mensaje.substring(3, 3); // porcion = "a“
  alert( porcion );

  var mensaje = "Hola Mundo";
  var porcion = mensaje.substring(5, 0); // porcion = "Hola "
  alert( porcion );
  porcion = mensaje.substring(0, 2); // porcion = "Hola "
  alert( porcion );

  var mensaje = "Hola Mundo, soy una cadena de texto!";
  var palabras = mensaje.split(" ");
  // palabras = ["Hola", "Mundo,", "soy", "una", "cadena", "de", "texto!"];
  alert( palabras );

  var palabra = "Hola";
  var letras = palabra.split(""); // letras = ["H", "o", "l", "a"]
  alert( letras );




}
</script>

</body>
</html>
