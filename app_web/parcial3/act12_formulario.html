<!DOCTYPE html>
<html>
    <head>
        <script>
            function validateForm() {
                let x = document.forms["myForm"]["fname"].value;
                let text = "";
                if (x == "") {
                    alert("Ingrese nombre");
                }
                else text += "Nombre OK \n";
                let y = document.getElementById("num").value;
                if (isNaN(y) || y < 1 || y > 50) {
                    alert("Ingrese edad ");
                } else {
                    text += "Edad OK \n";
                }
                let z = document.forms["myForm"]["RFC"].value;
            if (z == "") {
                    alert("Ingrese RFC ");
                }
                else text += "RFC OK \n";	 	
                document.getElementById("demo").innerHTML = text;
                console.log(text);
                alert(text);
            }
        </script>
    </head>


    <body>
        <header>
            <h1>Actividad 12 - Formulario</h1>
        </header>
    <br>
        <form name="myForm" action="#" onsubmit="return validateForm()" method="post">
            Name:   <input type="text" name="fname">
            <br><br>
            Edad:   <input id="num" type="text">
            <br><br>
            RFC:    <input type="text" name="RFC" required>
            <br><br>
            <input type="submit" value="Submit">
            
            <p id="demo"></p>
        </form>

        <footer>
            <p>Renata Rodríguez Martínez | 189363</p>
        </footer>
    </body>
</html>
