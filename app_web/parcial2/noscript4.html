<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo de noscript</title>
    <link rel="stylesheet" type="text/css" href="css/general.css" media="screen" />
    <link rel="icon" type="image/webp" href="assets/Eternal_sugar_head.webp">
</head>
<body>
    <header>
        <h1>Ejemplo de noscript</h1>
    </header>

    <!-- Contenido normal si JavaScript funciona -->
    <script>
        document.write("¡JavaScript esta activado y funcionando!");
    </script>

    <!-- Contenido alternativo si JavaScript esta desactivado -->
    <noscript>
        <p style="color: red;">Atencion: Tu navegador tiene JavaScript deshabilitado. Por favor, activalo para ver esta pagina correctamente.</p>
    </noscript>

    <footer>Renata Rodríguez Martínez, 189363</footer>
</body>
</html>

<!--

Cómo activarlo según tu navegador


Google Chrome (Computadora)

1. Haz clic en el menú de los tres puntos (en la esquina superior derecha) y selecciona Configuración.
2. En el panel izquierdo, entra en Privacidad y seguridad.
3. Haz clic en Configuración de sitios.
4. Desplázate hacia abajo y selecciona JavaScript (dentro del apartado de Contenido).
5. Marca la opción Los sitios pueden usar JavaScript. Recarga la página.


Microsoft Edge

1. Haz clic en los tres puntos arriba a la derecha y entra en Configuración.
2. Entra en Privacidad, búsqueda y servicios (o Cookies y permisos del sitio).
3. Busca JavaScript y actívalo para que esté permitido en los sitios web.
-->
