<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" type="text/css" href="css/general.css" media="screen" />

<style> 
div {
  width: 50px;
  height: 50px;
  background-color: rgb(198, 155, 155);
  transition: width 2s, height 2s, background-color 2s, transform 2s;
}

div:hover {
  width: 400px;
  height: 400px;
  background-color: rgb(243, 131, 215);  
  transform: rotate(360deg);
}
</style>
</head>
<body>
    <h1>Transicion y Transformacion</h1>
    <p>Coloca el cursor sobre el elemento div que aparece a continuación:</p>
    <div></div>

</body>
