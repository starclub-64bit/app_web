<!DOCTYPE html>
<html>
    <head>
        <script>
            var txt = "";
            var dias = ["LUNES","MARTES","MIERCOLES","JUEVES","VIERNES","SABADO","DOMINGO"]; 
            alert(dias);
            var x;
            for (x in dias) {
                txt += dias[x] + "\n";
            }
            alert(txt);
        </script>
        </head>
    <body>
        <h2>javascript loops</h2>
    </body>
</html>
